<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>YouTube Downloader | Ø's Handy Dandy Toolbox</title>
    <meta name = "viewport" content="width=device-width, initial-scale=1.0">
    <link rel ="stylesheet" href="../../assets/css/main.css">
</head>
<body>
    <header>
        <h1>YouTube Downloader</h1>
        <p>Paste a YouTube link and choose a format</p>
    </header>
    <main style="padding: 2rem; max-width: 600px; margin: auto;">
        <input type="text" placeholder="YouTube URL" style="width:100%; padding:10px;">
        <br><br>
        <select style="width:100%; padding:10px;">
            <option>MP4 (Video)</option>
            <option>MP3 (Audio)</option>
        </select>
        <br><br>
        <button style="width:100%; padding:12px;">Download</button>
        <p style="opacity:0.6; margin-top:1rem;">
            
        </p>
    </main>
</body>
</html>

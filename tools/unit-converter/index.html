<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Unit Converter | Ø's Handy Dandy Toolbox</title>
        <link rel="stylesheet" href="../../assets/css/converter.css">
    </head>
    <body>
        <div class="container">
            <a href="../../index.html" class="back">← Go Back</a>
            <h1>Universal Unit Converter</h1>
            <div class="converter-box">
                <div class="tabs">
                    <button class="tab active" onclick="setCategory('length')">Length</button>
                    <button class="tab" onclick="setCategory('mass')">Mass</button>
                    <button class="tab" onclick="setCategory('temp')">Temp</button>
                </div>
                <div class="conversion-area">
                    <div class="input-group">
                        <label>From:</label>
                        <input type="number" id="inputVal" placeholder="0" oninput="convert()">
                        <select id="unitFrom" onchange="convert()"></select>
                    </div>
                    <div class="icon">→</div>
                    <div class="input-group">
                        <label>To:</label>
                        <input type="number" id="outputVal" readonly placeholder="0">
                        <select id="unitTo" onchange="convert()"></select>
                    </div>
                </div>
            </div>
        </div>
        <script>
            const units = {
                length: ['Centimeters', 'Meters', 'Kilometers', 'Feet', 'Inches', 'Miles'],
                mass: ['Kilograms', 'Grams', 'Pounds', 'Ounces'],
                temp: ['Celsius', 'Fahrenheit', 'Kelvin']
            };
            const rates = {
                length: {'Centimeters': 0.01, 'Meters': 1, 'Kilometers': 1000, 'Feet': 0.3048, 'Inches': 0.0254, 'Miles': 1609.34 },
                mass: { 'Grams': 1, 'Kilograms': 1000, 'Pounds': 453.592, 'Ounces': 28.3495 }
            };
            let currentCat = 'length';
            function setCategory(cat) {
                currentCat = cat;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                event.target.classList.add('active');
                const fromSel = document.getElementById('unitFrom');
                const toSel = document.getElementById('unitTo');
                fromSel.innerHTML = '';
                toSel.innerHTML = '';
                units[cat].forEach(u => {
                    fromSel.add(new Option(u, u));
                    toSel.add(new Option(u, u));
                });
                toSel.selectedIndex = 1;
                document.getElementById('inputVal').value = '';
                document.getElementById('outputVal').value = '';
            }
            function convert() {
                const val = parseFloat(document.getElementById('inputVal').value);
                const from = document.getElementById('unitFrom').value;
                const to = document.getElementById('unitTo').value;
                const output = document.getElementById('outputVal');
                if (isNaN(val)) {
                    output.value = '';
                    return;
                }
                let result;
                if (currentCat === 'temp') {
                    result = convertTemp(val, from, to);
                }
                else {
                    const base = val * rates[currentCat][from];
                    result = base / rates[currentCat][to];
                }
                output.value = parseFloat(result.toFixed(4));
            }
            function convertTemp(val, from, to) {
                if(from === to) return val;
                let celsius;
                if(from === 'Celsius') celsius = val;
                if(from === 'Fahrenheit') celsius = (val - 32) * 5/9;
                if(from === 'Kelvin') celsius = val - 273.15;
                if(to === 'Celsius') return celsius;
                if(to === 'Fahrenheit') return (celsius * 9/5) + 32;
                if(to === 'Kelvin') return celsius + 273.15;
            }
            window.onload = () => setCategory('length');
        </script>
    </body>

</html>

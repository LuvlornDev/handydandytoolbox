<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Image Color Inverter | Ø's Handy Dandy Toolbox</title>
        <link rel="stylesheet" href="../../assets/css/image-inverter.css">
    </head>
    <body>
        <div class="container">
            <a href="../../index.html" class="back">← Go Back</a>
            <h1>Image Color Inverter</h1>
            <div class="controls">
                <div class="control-group">
                    <label for="imgupl">Upload Image:</label>
                    <input type="file" id="imgupl" accept="image/*"></input>
                </div>
                <div class="control-group">
                    <label>&nbsp</label>
                    <button onclick="invimg()">Invert Colors</button>
                </div>
                <div class="control-group">
                    <label>&nbsp;</label>
                    <button class="danger" onclick="resetinv()">Reset</button>
                </div>
            </div>
            <div class="preview-area">
                <div class="preview-container">
                    <div class="preview-item">
                        <h3>Original</h3>
                        <img id="ogimg" src="" alt="Original Image">
                        <div class="placeholder" id="ogplaceholder">Upload an Image</div>
                    </div>
                    <div class="preview-item">
                        <h3>Inverted</h3>
                        <canvas id="invcanvas" style="max-width: 100%; max-height: 400px; border-radius: 8px; display: none;"></canvas>
                        <div class="placeholder" id="invplaceholder">Inverted image will show up here</div>
                    </div>
                </div>
                <div class="downloadsec" id="downloadsec">
                    <button onclick="downloadinvimg()">⬇ Download Inverted Image</button>
                </div>
            </div>
        </div>
        <script>
            const ogimg = document.getElementById('ogimg');
            const invcanvas = document.getElementById('invcanvas');
            const imgupl = document.getElementById('imgupl');
            const downloadsec = document.getElementById('downloadsec');
            const ogplaceholder = document.getElementById('ogplaceholder');
            const invplaceholder = document.getElementById('invplaceholder');

            imgupl.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    ogimg.src = event.target.result;
                    ogimg.style.display = 'block';
                    ogplaceholder.style.display = 'none';

                    invcanvas.style.display = 'none';
                    invplaceholder.style.display = 'block';
                    downloadsec.style.display = 'none';
                };
                reader.readAsDataURL(file);
            });

            function invimg() {
                if (!ogimg.src) return;

                const ctx = invcanvas.getContext('2d');
                invcanvas.width = ogimg.naturalWidth;
                invcanvas.height = ogimg.naturalHeight;

                ctx.drawImage(ogimg, 0, 0);

                const imgdata = ctx.getImageData(0, 0, invcanvas.width, invcanvas.height);
                const data = imgdata.data;

                for (let i = 0; i < data.length; i += 4) {
                    data[i] = 255 - data[i];       // Red
                    data[i + 1] = 255 - data[i + 1]; // Green
                    data[i + 2] = 255 - data[i + 2]; // Blue
                }

                ctx.putImageData(imgdata, 0, 0);

                invcanvas.style.display = 'block';
                invplaceholder.style.display = 'none';
                downloadsec.style.display = 'flex';
            }

            function resetinv() {
                ogimg.src = '';
                ogimg.style.display = 'none';
                ogplaceholder.style.display = 'block';

                invcanvas.style.display = 'none';
                invplaceholder.style.display = 'block';
                downloadsec.style.display = 'none';

                imgupl.value = '';
            }

            function downloadinvimg() {
                const link = document.createElement('a');
                link.href = invcanvas.toDataURL('image/png');
                link.download = 'inverted-image.png';
                link.click();
            }
        </script>
    </body>
</html>
